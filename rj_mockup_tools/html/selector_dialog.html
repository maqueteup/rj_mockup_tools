<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakettePro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f2f5; --panel-bg: #ffffff; --text-color: #3d4a5c;
            --text-light-color: #8a96a8; --border-color: #e9ecef; --primary-color: #007bff;
            --header-color: #2a3e54; --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            font-size: 100%; /* Ponto de partida para a escala */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; background-color: var(--panel-bg); color: var(--text-color); overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-size: 0.9rem; /* Tamanho base da fonte */ }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 1rem; }
        .category { background-color: var(--panel-bg); border-radius: 0.5rem; padding: 1rem; }
        .category-title { font-size: 1rem; font-weight: 600; color: var(--header-color); margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--primary-color); }
        .tool-grid { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .tool-button { background-color: #f8f9fa; color: var(--text-light-color); border: 1px solid var(--border-color); width: 2.8rem; height: 2.8rem; font-size: 1.2rem; border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .tool-button:hover { background-color: var(--primary-color); color: white; transform: translateY(-2px); }
        
        .button-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 0.25rem; }
        .selector-button { padding: 0.4rem; border: none; border-radius: 2px; font-size: 0.75rem; font-weight: 200; text-align: center; cursor: pointer; transition: all 0.2s ease; color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .selector-button:hover { filter: brightness(1.1); transform: scale(1.05); }

        .search-bar { position: relative; margin: 0 1rem 0 1rem; }
        .search-bar input { width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; border-radius: 0.5rem; border: 1px solid var(--border-color); font-size: 0.9rem; background-color: var(--panel-bg); }
        .search-bar .fa-search { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light-color); }
        .footer-actions { padding: 0.5rem 1rem; border-top: 1px solid var(--border-color); background-color: var(--panel-bg); display: flex; justify-content: space-between; align-items: center; }
        .action-button { background: none; border: none; color: var(--text-light-color); cursor: pointer; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.3rem; width: 80px; border-radius: 0.5rem; transition: color 0.2s, background-color 0.2s; }
        .action-button i { font-size: 1.3rem; }
        .action-button:hover { color: var(--primary-color); background-color: #f0f5ff; }
        
        /* Controle de Escala */
        .scale-control { display: flex; align-items: center; gap: 0.5rem; }
        .scale-control label { font-size: 0.8rem; color: var(--text-light-color); }
        .scale-control select { font-size: 0.8rem; padding: 0.2rem; border-radius: 4px; border: 1px solid var(--border-color); }
        
		.empty-state { text-align: center; color: #888; padding: 10px; font-style: italic; }
		
		/* Notificadores existentes */
        #update-notifier {
            display: none;
    background-color: var(--primary-color);
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
    margin: 0 15px 15px 15px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.3s;
        }
        #update-notifier:hover { background-color: #0056b3; }
        #update-notifier i { margin-right: 8px; }

        
		#engraving-notifier {
    display: none;
    background-color: var(--primary-color);
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
    margin: 0 15px 15px 15px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.3s;
}
#engraving-notifier:hover { background-color: #0056b3; }
#engraving-notifier i { margin-right: 8px; }


#mirrored-notifier {
            display: none;
            background-color: #ffc107;
            color: #333;
            padding: 8px 12px;
            margin: 0 15px 15px 15px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .mirrored-text i {
            margin-right: 8px;
        }
        .mirrored-buttons button {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #333;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
            transition: background-color 0.2s;
        }
        .mirrored-buttons button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

#scaled-notifier {
            display: none;
            background-color: #17a2b8;
            color: white;
            padding: 8px 12px;
            margin: 0 15px 15px 15px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .scaled-text i {
            margin-right: 8px;
        }
        .scaled-buttons button {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
            transition: background-color 0.2s;
        }
        .scaled-buttons button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

/* PAINEL DE DESTAQUE (CONTADOR DE PEÇAS) */
#stats-panel {
    background: linear-gradient(45deg, var(--header-color), var(--primary-color));
    color: white;
    text-align: center;
    padding: 15px;
    margin: 0;
}
.stats-number {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
}
.stats-label {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 4px;
}

/* === MENSAGENS DO WORKFLOW INTELIGENTE === */
.workflow-message {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    margin: 0 15px 10px 15px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    animation: slideDown 0.4s ease-out;
    position: relative;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    border-left: 4px solid;
}

.workflow-success {
    background-color: #d4edda;
    color: #155724;
    border-color: #28a745;
    border-left-color: #28a745;
}

.workflow-info {
    background-color: #d1ecf1;
    color: #0c5460;
    border-color: #17a2b8;
    border-left-color: #17a2b8;
}

.workflow-warning {
    background-color: #fff3cd;
    color: #856404;
    border-color: #ffc107;
    border-left-color: #ffc107;
}

.workflow-error {
    background-color: #f8d7da;
    color: #721c24;
    border-color: #dc3545;
    border-left-color: #dc3545;
}

.workflow-message i {
    font-size: 16px;
    flex-shrink: 0;
}

.workflow-message span {
    flex-grow: 1;
    line-height: 1.4;
}

@keyframes slideDown {
    from {
        transform: translateY(-30px);
        opacity: 0;
        max-height: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
        max-height: 100px;
        margin-bottom: 10px;
        padding-top: 14px;
        padding-bottom: 14px;
    }
}

@keyframes slideUp {
    from {
        transform: translateY(0);
        opacity: 1;
        max-height: 100px;
        margin-bottom: 10px;
        padding-top: 14px;
        padding-bottom: 14px;
    }
    to {
        transform: translateY(-30px);
        opacity: 0;
        max-height: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
    }
}

.workflow-message.hiding {
    animation: slideUp 0.3s ease-in forwards;
}

/* Responsivo para telas menores */
@media (max-width: 400px) {
    .workflow-message {
        margin: 0 10px 8px 10px;
        padding: 12px 14px;
        font-size: 13px;
    }
}

    </style>
</head>
<body>
<div id="update-notifier">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="update-notifier-text"></span>
            </div>

	<div id="engraving-notifier">
		<i class="fas fa-info-circle"></i>
		<span id="engraving-notifier-text"></span>
	</div>

<div id="mirrored-notifier">
        <div class="mirrored-text">
            <i class="fas fa-exclamation-circle"></i>
            <span id="mirrored-notifier-text"></span>
        </div>
        <div class="mirrored-buttons">
            <button onclick="sketchup.run_command('select_mirrored')">Selecionar</button>
            <button onclick="sketchup.run_command('fix_all_mirrored')">Corrigir Todos</button>
        </div>
    </div>

<div id="scaled-notifier">
        <div class="scaled-text">
            <i class="fas fa-compress-arrows-alt"></i>
            <span id="scaled-notifier-text"></span>
        </div>
        <div class="scaled-buttons">
            <button onclick="sketchup.run_command('select_scaled')">Selecionar</button>
            <button onclick="sketchup.run_command('fix_selected_scaled')">Corrigir Seleção</button>
        </div>
    </div>

    <div class="main-content">
        <div class="category">
            <h2 class="category-title">Ferramentas</h2>
            <div class="tool-grid">
                 <button id="tool-face_to_board" class="tool-button" title="Face to Board" onclick="sketchup.run_command('face_to_board')"><i class="fas fa-layer-group"></i></button>
                 <button id="tool-group_to_component" class="tool-button" title="Group to Component" onclick="sketchup.run_command('group_to_component')"><i class="fas fa-cubes"></i></button>
                 <button id="tool-reset_ucs" class="tool-button" title="Reset UCS" onclick="sketchup.run_command('reset_ucs')"><i class="fas fa-crosshairs"></i></button>
                 <button id="tool-flip_ucs" class="tool-button" title="Flip UCS" onclick="sketchup.run_command('flip_ucs')"><i class="fas fa-retweet"></i></button>
                 <button id="tool-rename_entities" class="tool-button" title="Rename" onclick="sketchup.run_command('rename_entities')"><i class="fas fa-i-cursor"></i></button>
                 <button id="tool-rot_x" class="tool-button" title="Rotate X" onclick="sketchup.run_command('rot_x')"><i class="fas fa-undo"></i></button>
                 <button id="tool-rot_y" class="tool-button" title="Rotate Y" onclick="sketchup.run_command('rot_y')"><i class="fas fa-redo"></i></button>
                 <button id="tool-rot_z" class="tool-button" title="Rotate Z" onclick="sketchup.run_command('rot_z')"><i class="fas fa-sync-alt"></i></button>
                 <button id="tool-create_engraving" class="tool-button" title="Criar Gravação a Laser na Seleção" onclick="sketchup.run_command('create_engraving')"><i class="fas fa-pencil-ruler"></i></button>
                 <button id="tool-apply_stamp_native" class="tool-button" title="Aplicar Carimbo" onclick="sketchup.run_command('apply_stamp_native')"><i class="fas fa-font"></i></button>
                 <button id="tool-select_stamps" class="tool-button" title="Select Carimbos" onclick="sketchup.run_command('select_stamps')"><i class="fas fa-tasks"></i></button>
				 <button id="tool-color_manager" class="tool-button" title="Gerenciador de Cores" onclick="sketchup.run_command('color_manager')"><i class="fas fa-palette"></i></button>
                 <button id="tool-planifier" class="tool-button" title="Planificar Peças" onclick="sketchup.run_command('planifier')"><i class="fas fa-th"></i></button>
				 <button id="tool-collision_analyzer" class="tool-button" title="Analisador de Colisões" onclick="sketchup.run_command('collision_analyzer')"><i class="fas fa-object-group"></i></button>
            </div>
        </div>
        
		<div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar...">
    </div>
		
        <div class="category">
            <h2 class="category-title">Materiais</h2>
            <div id="materials-grid" class="button-grid"></div>
        </div>
        
        <div class="category">
            <h2 class="category-title">Acabamentos</h2>
            <div id="finishes-grid" class="button-grid"></div>
        </div>
    </div>

<div id="stats-panel">
        <div class="stats-number" id="makette-piece-count">0</div>
        <div class="stats-label">peças MakettePro no seu projeto</div>
    </div>

    <div class="footer-actions">
        <button id="configureStampBtn" class="action-button"><i class="fas fa-sliders-h"></i><span>Carimbo</span></button>
        <button id="openManagerBtn" class="action-button"><i class="fas fa-cog"></i><span>Gerenciar</span></button>
        <button id="tool-update_stamps" class="action-button" onclick="sketchup.run_command('update_stamps')"><i class="fas fa-magic"></i><span>Atualizar</span></button>
        
		<div class="scale-control">
            <label for="scale-selector">Zoom:</label>
            <select id="scale-selector">
			    <option value="70%">70%</option>
                <option value="80%">80%</option>
                <option value="90%">90%</option>
                <option value="100%" selected>100%</option>
                <option value="110%">110%</option>
            </select>
        </div>
    </div>
    
    <script>
        // === SISTEMA DE MENSAGENS DO WORKFLOW INTELIGENTE ===
        let workflowMessageTimeout = null;
        let currentWorkflowMessage = null;

        function showWorkflowMessage(message, type, duration) {
            // Remove mensagem anterior se existir
            hideWorkflowMessage();
            
            // Cria elemento de mensagem
            const messageEl = document.createElement('div');
            messageEl.id = 'workflow-message';
            messageEl.className = `workflow-message workflow-${type}`;
            
            // Ícones por tipo
            const icons = {
                success: 'fas fa-check-circle',
                info: 'fas fa-info-circle', 
                warning: 'fas fa-exclamation-triangle',
                error: 'fas fa-times-circle'
            };
            
            messageEl.innerHTML = `
                <i class="${icons[type] || icons.info}"></i>
                <span>${message}</span>
            `;
            
            // Insere no topo da interface
            const firstNotifier = document.getElementById('update-notifier');
            firstNotifier.parentNode.insertBefore(messageEl, firstNotifier);
            
            currentWorkflowMessage = messageEl;
            
            // Remove após o tempo especificado
            workflowMessageTimeout = setTimeout(() => {
                hideWorkflowMessage();
            }, duration);
            
            console.log(`Workflow message: ${type} - ${message}`);
        }

        function hideWorkflowMessage() {
            if (currentWorkflowMessage) {
                // Animação de saída
                currentWorkflowMessage.classList.add('hiding');
                
                // Remove após animação
                setTimeout(() => {
                    if (currentWorkflowMessage && currentWorkflowMessage.parentNode) {
                        currentWorkflowMessage.parentNode.removeChild(currentWorkflowMessage);
                    }
                    currentWorkflowMessage = null;
                }, 300);
            }
            
            if (workflowMessageTimeout) {
                clearTimeout(workflowMessageTimeout);
                workflowMessageTimeout = null;
            }
        }

        // === JAVASCRIPT PRINCIPAL ===
        let globalProperties = {}; 

        function populateSelector(data) {
            const materialsGrid = document.getElementById('materials-grid');
            const finishesGrid = document.getElementById('finishes-grid');
            let materialsHTML = '';
            let finishesHTML = '';
            globalProperties = data;

            // MATERIAIS - estático, carrega uma vez
            if (data && Array.isArray(data.materials) && Array.isArray(data.types)) {
                const typeColors = {};
                data.types.forEach(type => { typeColors[type.name] = type.color; });

                data.materials.filter(material => material.active).sort((a, b) => a.name.localeCompare(b.name)).forEach(material => {
                    const bgColor = typeColors[material.type] || material.color || '#34495e';
                    materialsHTML += `<button class="selector-button" title="${material.name}" style="background-color: ${bgColor};" onclick='runIntelligentWorkflowWithMaterial(${JSON.stringify(material)})'>${material.name}</button>`;
                });
            }

            // ACABAMENTOS - estático, carrega TODOS uma vez (não contextual)
            if (data && Array.isArray(data.finishes)) {
                data.finishes.filter(item => item.active).sort((a, b) => a.name.localeCompare(b.name)).forEach(finish => {
                    const bgColor = finish.color || '#8e44ad';
                    finishesHTML += `<button class="selector-button" title="${finish.name}" style="background-color: ${bgColor};" onclick='sketchup.apply_finish(${JSON.stringify(JSON.stringify(finish))})'>${finish.name}</button>`;
                });
            }

            materialsGrid.innerHTML = materialsHTML || '<div class="empty-state">Nenhum material cadastrado.</div>';
            finishesGrid.innerHTML = finishesHTML || '<div class="empty-state">Nenhum acabamento cadastrado.</div>';
            
            setupSearch();
        }

        // 🚀 FUNÇÃO PRINCIPAL DO WORKFLOW INTELIGENTE
        function runIntelligentWorkflowWithMaterial(material) {
            if (typeof sketchup !== 'undefined') {
                sketchup.run_intelligent_workflow_with_material(JSON.stringify(material));
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                document.querySelectorAll('.selector-button').forEach(button => {
                    const buttonText = button.textContent.toLowerCase();
                    button.style.display = buttonText.includes(searchTerm) ? 'block' : 'none';
                });
            });
        }
        
		function applySavedScale(scaleValue) {
            const scaleSelector = document.getElementById('scale-selector');
            const htmlElement = document.documentElement;

            if (scaleValue) {
                scaleSelector.value = scaleValue;
                htmlElement.style.fontSize = scaleValue;
            }
        }

        function setupScaleControl() {
            const scaleSelector = document.getElementById('scale-selector');

            const applyAndSaveScale = (scaleValue) => {
                document.documentElement.style.fontSize = scaleValue;
                if (typeof sketchup !== 'undefined') sketchup.save_preference('ui_scale', scaleValue);
            };

            scaleSelector.addEventListener('change', (e) => {
                applyAndSaveScale(e.target.value);
            });
            
            if (typeof sketchup !== 'undefined') {
                sketchup.get_preference('ui_scale');
            }
        }
		
        function updateUI(data) {
            // ❌ REMOVIDO: tool_states (botões sempre ativos)
            
			const engravingNotifier = document.getElementById('engraving-notifier');
            if (data.pending_engravings_count > 0) {
                engravingNotifier.querySelector('span').textContent = `${data.pending_engravings_count} peça(s) com gravação pendente`;
                engravingNotifier.style.display = 'block';
                engravingNotifier.onclick = () => {
                    if (typeof sketchup !== 'undefined') sketchup.run_command('create_all_engravings');
                };
            } else {
                engravingNotifier.style.display = 'none';
                engravingNotifier.onclick = null;
            }
			
            // ATUALIZA O PAINEL DE DESTAQUE
            if (data.makette_total_count !== undefined) {
                const countEl = document.getElementById('makette-piece-count');
                const labelEl = countEl.nextElementSibling;
                countEl.textContent = data.makette_total_count;

                if (data.makette_total_count === 1) {
                    labelEl.textContent = 'peça MakettePro no seu projeto';
                } else {
                    labelEl.textContent = 'peças MakettePro no seu projeto';
                }
            }
			
            // LÓGICA DO NOTIFICADOR DE ATUALIZAÇÃO
            const notifier = document.getElementById('update-notifier');
            if (data.updates_pending_count > 0) {
                notifier.querySelector('span').textContent = `${data.updates_pending_count} carimbo(s) para atualizar`;
                notifier.style.display = 'block';
                notifier.onclick = () => { if (typeof sketchup !== 'undefined') sketchup.run_command('fix_pending_stamps'); };
            } else {
                notifier.style.display = 'none';
                notifier.onclick = null;
            }

            const mirroredNotifier = document.getElementById('mirrored-notifier');
            if (data.mirrored_makette_count > 0) {
                const text = (data.mirrored_makette_count === 1) ? '1 peça espelhada detectada' : `${data.mirrored_makette_count} peças espelhadas detectadas`;
                document.getElementById('mirrored-notifier-text').textContent = text;
                mirroredNotifier.style.display = 'flex';
            } else {
                mirroredNotifier.style.display = 'none';
            }
        
            const scaledNotifier = document.getElementById('scaled-notifier');
            if (data.scaled_makette_count > 0) {
                const text = (data.scaled_makette_count === 1) ? '1 peça escalonada detectada' : `${data.scaled_makette_count} peças escalonadas detectadas`;
                document.getElementById('scaled-notifier-text').textContent = text;
                scaledNotifier.style.display = 'flex';
            } else {
                scaledNotifier.style.display = 'none';
            }

            // ❌ REMOVIDO: entity_info (painel de informações da seleção)
            // ❌ REMOVIDO: contextual_finishes (acabamentos dinâmicos)
        }

        window.onload = () => {
            if (typeof sketchup !== 'undefined') {
                sketchup.load_selector_data(); 
                // ❌ REMOVIDO: sketchup.get_selection_info()
            }
            document.getElementById('openManagerBtn').addEventListener('click', () => { if (typeof sketchup !== 'undefined') sketchup.open_manager(); });
            document.getElementById('configureStampBtn').addEventListener('click', () => { if (typeof sketchup !== 'undefined') sketchup.configure_stamp(); });
            
            setupScaleControl();
        };

        // Expor funções para teste global
        window.showWorkflowMessage = showWorkflowMessage;
        window.hideWorkflowMessage = hideWorkflowMessage;
    </script>
</body>
</html>
