<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renomear Defs/Grupos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary-color: #2a7a8c;
            --primary-light: #46bbd1;
            --secondary-color: #e74c3c;
            --accent-color: #f39c12;
            --danger-color: #c0392b;
            --text-color: #2c3e50;
            --light-text: #7f8c8d;
            --background: #ecf0f1;
            --card-bg: #ffffff;
            --border-radius: 6px;
            --shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            --hover-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            --border-color: #bdc3c7;
        }

        body {
            background-color: var(--background);
            color: var(--text-color);
            line-height: 1.3;
            min-height: 100vh;
            padding: 0.5rem;
            font-size: 14px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1rem;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        h2 {
            color: var(--secondary-color);
            font-size: 1rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.2rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--text-color);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-sizing: border-box;
            background-color: #f5f5f5;
            color: var(--text-color);
        }

        .inline-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .inline-group .form-group {
            flex: 1;
            margin-bottom: 0;
            min-width: 140px;
        }

        .inline-group.three-col .form-group {
            flex: 1;
        }

        .inline-group.three-col .form-group:first-child {
            flex: 1.5;
        }

        .inline-group input, .inline-group select {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            margin: 0;
            accent-color: var(--accent-color);
        }

        .panel {
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 20px;
            margin-top: 15px;
            background-color: #f9f9f9;
        }

        .panel-title {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: var(--primary-color);
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.primary {
            background-color: var(--primary-color);
            color: white;
        }

        button.secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: var(--hover-shadow);
        }

        .info-text {
            margin-top: 16px;
            padding: 8px;
            background-color: rgba(46, 204, 113, 0.1);
            border-radius: var(--border-radius);
            color: var(--text-color);
            font-size: 0.75rem;
        }

        .section-separator {
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0.25rem;
                font-size: 13px;
            }
            
            .container {
                padding: 0.75rem;
            }
            
            h2 {
                font-size: 0.9rem;
            }
            
            .inline-group {
                gap: 6px;
            }
            
            .inline-group .form-group {
                min-width: 100%;
            }
            
            .panel {
                padding: 12px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Renomear Defs/Grupos em Lote</h2>
        <div id="selection-info" class="info-text">
            0 objetos selecionados
        </div>

        <div class="form-group">
            <label for="nameMode">Modo de Renomeação:</label>
            <select id="nameMode">
                <option value="R">Substituir Completo (Prefixo+Sequência+Sufixo)</option>
                <option value="K">Manter Nome Original + Prefixo/Sufixo</option>
                <option value="F">Localizar/Substituir no Nome Original</option>
                <option value="N">Nome Original + Número (Nome_Sequência)</option>
                <option value="C">Primeira Letra + Sequência</option>
            </select>
        </div>

        <div id="findReplacePanel" class="panel" style="display: none;">
            <h3 class="panel-title">Localizar/Substituir</h3>
            <div class="form-group">
                <label for="findText">Localizar:</label>
                <input type="text" id="findText" placeholder="Texto a ser localizado">
            </div>
            <div class="form-group">
                <label for="replaceText">Substituir por:</label>
                <input type="text" id="replaceText" placeholder="Texto para substituir">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="keepCase" checked>
                <label for="keepCase">Considerar maiúsculas/minúsculas</label>
            </div>
        </div>

        <!-- Prefixo e Sufixo lado a lado -->
        <div class="inline-group">
            <div class="form-group">
                <label for="prefix">Prefixo:</label>
                <input type="text" id="prefix" placeholder="Ex: Comp_">
            </div>
            <div class="form-group">
                <label for="suffix">Sufixo:</label>
                <input type="text" id="suffix" placeholder="Ex: _v1">
            </div>
        </div>

        <div class="panel">
            <h3 class="panel-title">Configurações de Sequência</h3>
            <!-- Tipo de sequência, Valor Inicial e Incremento lado a lado -->
            <div class="inline-group three-col">
                <div class="form-group">
                    <label for="seqType">Tipo de Sequência:</label>
                    <select id="seqType">
                        <option value="N">Números (1, 2, 3, ...)</option>
                        <option value="A">Letras (A, B, C, ...)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startValue">Valor Inicial:</label>
                    <input type="text" id="startValue" value="1">
                </div>
                <div class="form-group">
                    <label for="increment">Incremento:</label>
                    <input type="number" id="increment" value="1" min="1">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="sortMethodDropdown">Ordenação:</label>
            <select id="sortMethodDropdown">
                <option value="SEL">Ordem de Seleção</option>
                <option value="C">ID (padrão)</option>
                <option value="L">Esquerda→Direita</option>
                <option value="R">Direita→Esquerda</option>
                <option value="F">Frente→Fundo</option>
                <option value="A">Fundo→Frente</option>
                <option value="B">Baixo→Cima</option>
                <option value="T">Cima→Baixo</option>
                <option value="NEAR">Distância (perto)</option>
                <option value="FAR">Distância (longe)</option>
                <option value="NAME">Nome (A-Z)</option>
                <option value="NAMEDESC">Nome (Z-A)</option>
                <option value="SIZE">Tamanho (menor)</option>
                <option value="SIZEDESC">Tamanho (maior)</option>
                <option value="RANDOM">Aleatório</option>
            </select>
        </div>

        <div class="button-group">
            <button class="secondary" id="btnCancel">Cancelar</button>
            <button class="primary" id="btnApply">Aplicar</button>
        </div>
    </div>

    <script>
        // Estado global
        let selectionCount = 0;
        let requestInProgress = false;
        
        // Inicialização do dialog
        function initializeDialog(count, settings) {
            selectionCount = count;
            document.getElementById('selection-info').textContent = 
                `${count} objeto${count !== 1 ? 's' : ''} selecionado${count !== 1 ? 's' : ''}`;
            
            // Preencher campos com os valores salvos
            document.getElementById('prefix').value = settings.prefix || '';
            document.getElementById('suffix').value = settings.suffix || '';
            document.getElementById('seqType').value = settings.seqType || 'N';
            document.getElementById('startValue').value = settings.startValue || '1';
            document.getElementById('increment').value = settings.increment || 1;
            
            // Modo de renomeação
            document.getElementById('nameMode').value = settings.nameMode || 'R';
            updateNameModePanel();
            
            // Find/Replace
            document.getElementById('findText').value = settings.findText || '';
            document.getElementById('replaceText').value = settings.replaceText || '';
            document.getElementById('keepCase').checked = settings.keepCase !== false;
            
            // Ordenação - atualiza o dropdown
            const sortMethod = settings.sortMethod || 'SEL';
            document.getElementById('sortMethodDropdown').value = sortMethod;
        }
        
        // Solicitar dados iniciais
        function request_initial_data() {
            if (!requestInProgress) {
                requestInProgress = true;
                sketchup.request_initial_data();
            }
        }
        
        // Alternar a visibilidade dos painéis
        function togglePanel(panelId, show) {
            document.getElementById(panelId).style.display = show ? 'block' : 'none';
        }
        
        // Atualizar painel de modo de renomeação
        function updateNameModePanel() {
            const nameMode = document.getElementById('nameMode').value;
            togglePanel('findReplacePanel', nameMode === 'F');
        }
        
        // Handler para salvar as configurações e fechar o diálogo
        function saveSettings() {
            const settings = {
                prefix: document.getElementById('prefix').value,
                suffix: document.getElementById('suffix').value,
                seqType: document.getElementById('seqType').value,
                startValue: document.getElementById('startValue').value,
                increment: parseInt(document.getElementById('increment').value) || 1,
                nameMode: document.getElementById('nameMode').value,
                findText: document.getElementById('findText').value,
                replaceText: document.getElementById('replaceText').value,
                keepCase: document.getElementById('keepCase').checked,
                sortMethod: document.getElementById('sortMethodDropdown').value
            };

            sketchup.save_settings(settings);
        }
        
        // Configurar event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Event listeners para atualizar a interface com base nas seleções
            document.getElementById('nameMode').addEventListener('change', updateNameModePanel);

            // Botões
            document.getElementById('btnApply').addEventListener('click', saveSettings);
            document.getElementById('btnCancel').addEventListener('click', function() {
                sketchup.cancel();
            });
            
            // Sincronizar o dropdown de ordenação com os radio buttons ocultos
            document.getElementById('sortMethodDropdown').addEventListener('change', function() {
                const selectedValue = this.value;
            });
            
            // Atualizar campos baseado no tipo de sequência
            document.getElementById('seqType').addEventListener('change', function() {
                const startValueInput = document.getElementById('startValue');
                if (this.value === 'A') {
                    startValueInput.value = startValueInput.value.replace(/[^A-Za-z]/g, '') || 'A';
                    startValueInput.value = startValueInput.value.toUpperCase();
                } else {
                    startValueInput.value = parseInt(startValueInput.value) || 1;
                }
            });
            
            // Validar entrada do valor inicial
            document.getElementById('startValue').addEventListener('change', function() {
                const seqType = document.getElementById('seqType').value;
                if (seqType === 'A') {
                    this.value = this.value.replace(/[^A-Za-z]/g, '') || 'A';
                    this.value = this.value.toUpperCase();
                } else {
                    this.value = parseInt(this.value) || 1;
                }
            });
        });
    </script>
    
    <!-- Hidden radio buttons for backward compatibility -->
    <div style="display: none;">
        <div class="sort-options">
            <div class="sort-option">
                <input type="radio" id="sortC" name="sortMethod" value="C" checked>
                <label for="sortC">ID (padrão)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortL" name="sortMethod" value="L">
                <label for="sortL">Esquerda→Direita</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortR" name="sortMethod" value="R">
                <label for="sortR">Direita→Esquerda</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortF" name="sortMethod" value="F">
                <label for="sortF">Frente→Fundo</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortA" name="sortMethod" value="A">
                <label for="sortA">Fundo→Frente</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortB" name="sortMethod" value="B">
                <label for="sortB">Baixo→Cima</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortT" name="sortMethod" value="T">
                <label for="sortT">Cima→Baixo</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortNEAR" name="sortMethod" value="NEAR">
                <label for="sortNEAR">Distância (perto)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortFAR" name="sortMethod" value="FAR">
                <label for="sortFAR">Distância (longe)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortNAME" name="sortMethod" value="NAME">
                <label for="sortNAME">Nome (A-Z)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortNAMEDESC" name="sortMethod" value="NAMEDESC">
                <label for="sortNAMEDESC">Nome (Z-A)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortSIZE" name="sortMethod" value="SIZE">
                <label for="sortSIZE">Tamanho (menor)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortSIZEDESC" name="sortMethod" value="SIZEDESC">
                <label for="sortSIZEDESC">Tamanho (maior)</label>
            </div>
            <div class="sort-option">
                <input type="radio" id="sortRANDOM" name="sortMethod" value="RANDOM">
                <label for="sortRANDOM">Aleatório</label>
            </div>
        </div>
    </div>
</body>
</html>
