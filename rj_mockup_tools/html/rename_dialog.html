<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renomear Defs/Grupos</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #3d4a5c;
            --text-light-color: #8a96a8;
            --border-color: #e9ecef;
            --primary-color: #007bff;
            --header-color: #2a3e54;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --orange: #FF8C00;
            --success: #28a745;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 25px;
            max-width: 550px;
            margin: 0 auto;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--header-color);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .inline-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .info-text {
            flex: 1;
            padding: 10px 15px;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background-color: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .inline-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .inline-group.three-col .form-group:first-child {
            flex: 1.5;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--orange);
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 14px;
        }

        .panel {
            background: linear-gradient(135deg, #f8f9fa, #f0f2f5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--header-color);
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        button.primary {
            background: linear-gradient(135deg, var(--orange), #e67e22);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }

        button.secondary {
            background: #f8f9fa;
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        button.secondary:hover {
            background: var(--border-color);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .inline-group {
                flex-direction: column;
                align-items: stretch;
            }

            .inline-group .form-group {
                width: 100%;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Renomear Defs/Grupos em Lote</h2>
        <div class="inline-group" style="align-items: center;">
            <div id="selection-info" class="info-text">
                0 objetos selecionados
            </div>
            <button id="btnSelect" class="primary" style="width: auto; padding: 10px 20px;">Selecionar</button>
        </div>

        <div class="form-group">
            <label for="nameMode">Modo de Renomeação:</label>
            <select id="nameMode">
                <option value="R">Substituir Completo (Prefixo+Sequência+Sufixo)</option>
                <option value="K">Manter Nome Original + Prefixo/Sufixo</option>
                <option value="F">Localizar/Substituir no Nome Original</option>
                <option value="N">Nome Original + Número (Nome_Sequência)</option>
                <option value="C">Primeira Letra + Sequência</option>
            </select>
        </div>

        <div id="findReplacePanel" class="panel" style="display: none;">
            <h3 class="panel-title">Localizar/Substituir</h3>
            <div class="form-group">
                <label for="findText">Localizar:</label>
                <input type="text" id="findText" placeholder="Texto a ser localizado">
            </div>
            <div class="form-group">
                <label for="replaceText">Substituir por:</label>
                <input type="text" id="replaceText" placeholder="Texto para substituir">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="keepCase" checked>
                <label for="keepCase">Considerar maiúsculas/minúsculas</label>
            </div>
        </div>

        <div class="inline-group">
            <div class="form-group">
                <label for="prefix">Prefixo:</label>
                <input type="text" id="prefix" placeholder="Ex: Comp_">
            </div>
            <div class="form-group">
                <label for="suffix">Sufixo:</label>
                <input type="text" id="suffix" placeholder="Ex: _v1">
            </div>
        </div>

        <div class="panel">
            <h3 class="panel-title">Configurações de Sequência</h3>
            <div class="inline-group three-col">
                <div class="form-group">
                    <label for="seqType">Tipo:</label>
                    <select id="seqType">
                        <option value="N">Números (1, 2, 3, ...)</option>
                        <option value="A">Letras (A, B, C, ...)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startValue">Inicial:</label>
                    <input type="text" id="startValue" value="1">
                </div>
                <div class="form-group">
                    <label for="increment">Incremento:</label>
                    <input type="number" id="increment" value="1" min="1">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="sortMethodDropdown">Ordenação:</label>
            <select id="sortMethodDropdown">
                <option value="SEL">Ordem de Seleção</option>
                <option value="C">ID (padrão)</option>
                <option value="L">Esquerda→Direita</option>
                <option value="R">Direita→Esquerda</option>
                <option value="F">Frente→Fundo</option>
                <option value="A">Fundo→Frente</option>
                <option value="B">Baixo→Cima</option>
                <option value="T">Cima→Baixo</option>
                <option value="NEAR">Distância (perto)</option>
                <option value="FAR">Distância (longe)</option>
                <option value="NAME">Nome (A-Z)</option>
                <option value="NAMEDESC">Nome (Z-A)</option>
                <option value="SIZE">Tamanho (menor)</option>
                <option value="SIZEDESC">Tamanho (maior)</option>
                <option value="RANDOM">Aleatório</option>
            </select>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="applyStamp" checked>
            <label for="applyStamp">Carimbar (aplica carimbo se não existir)</label>
        </div>

        <div class="button-group">
            <button class="secondary" id="btnCancel">Cancelar</button>
            <button class="primary" id="btnApply">Aplicar</button>
        </div>
    </div>

    <script>
        let selectionCount = 0;
        let requestInProgress = false;

        function initializeDialog(count, settings) {
            selectionCount = count;
            updateSelectionCount(count);
            document.getElementById('prefix').value = settings.prefix || '';
            document.getElementById('suffix').value = settings.suffix || '';
            document.getElementById('seqType').value = settings.seqType || 'N';
            document.getElementById('startValue').value = settings.startValue || '1';
            document.getElementById('increment').value = settings.increment || 1;
            document.getElementById('nameMode').value = settings.nameMode || 'R';
            updateNameModePanel();
            document.getElementById('findText').value = settings.findText || '';
            document.getElementById('replaceText').value = settings.replaceText || '';
            document.getElementById('keepCase').checked = settings.keepCase !== false;
            document.getElementById('sortMethodDropdown').value = settings.sortMethod || 'SEL';
            document.getElementById('applyStamp').checked = settings.applyStamp !== false;
        }

        function updateSelectionCount(count) {
            selectionCount = count;
            document.getElementById('selection-info').textContent =
                `${count} objeto${count !== 1 ? 's' : ''} selecionado${count !== 1 ? 's' : ''}`;
        }

        function request_initial_data() {
            if (!requestInProgress) {
                requestInProgress = true;
                sketchup.request_initial_data();
            }
        }

        function togglePanel(panelId, show) {
            document.getElementById(panelId).style.display = show ? 'block' : 'none';
        }

        function updateNameModePanel() {
            const nameMode = document.getElementById('nameMode').value;
            togglePanel('findReplacePanel', nameMode === 'F');
        }

        function saveSettings() {
            const settings = {
                prefix: document.getElementById('prefix').value,
                suffix: document.getElementById('suffix').value,
                seqType: document.getElementById('seqType').value,
                startValue: document.getElementById('startValue').value,
                increment: parseInt(document.getElementById('increment').value) || 1,
                nameMode: document.getElementById('nameMode').value,
                findText: document.getElementById('findText').value,
                replaceText: document.getElementById('replaceText').value,
                keepCase: document.getElementById('keepCase').checked,
                sortMethod: document.getElementById('sortMethodDropdown').value,
                applyStamp: document.getElementById('applyStamp').checked
            };
            sketchup.save_settings(settings);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('nameMode').addEventListener('change', updateNameModePanel);
            document.getElementById('btnSelect').addEventListener('click', function() {
                sketchup.start_selection();
            });
            document.getElementById('btnApply').addEventListener('click', saveSettings);
            document.getElementById('btnCancel').addEventListener('click', function() {
                sketchup.cancel();
            });

            document.getElementById('seqType').addEventListener('change', function() {
                const startValueInput = document.getElementById('startValue');
                if (this.value === 'A') {
                    startValueInput.value = startValueInput.value.replace(/[^A-Za-z]/g, '') || 'A';
                    startValueInput.value = startValueInput.value.toUpperCase();
                } else {
                    startValueInput.value = parseInt(startValueInput.value) || 1;
                }
            });

            document.getElementById('startValue').addEventListener('change', function() {
                const seqType = document.getElementById('seqType').value;
                if (seqType === 'A') {
                    this.value = this.value.replace(/[^A-Za-z]/g, '') || 'A';
                    this.value = this.value.toUpperCase();
                } else {
                    this.value = parseInt(this.value) || 1;
                }
            });
        });
    </script>
</body>
</html>
