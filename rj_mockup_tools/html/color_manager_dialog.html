<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Cores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f4f4; overflow: hidden; }
        .container { padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h3 { margin: 0; color: #333; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .material-count { font-size: 12px; color: #888; font-weight: 500; }
        /* Botão de adicionar foi removido */
        #search-box { width: calc(100% - 18px); padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
        #material-list-container { flex-grow: 1; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; background-color: white; }
        
        /* Grid ajustado para não ter a coluna de deletar */
        .material-item { display: grid; grid-template-columns: 1fr 40px 40px 25px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #eee; }
        .list-header { font-weight: 600; font-size: 11px; color: #888; text-transform: uppercase; background-color: #f9f9f9; text-align: center; }
        
        .material-name-input { font-size: 13px; border: none; background: transparent; width: 100%; padding: 4px; border-radius: 2px; }
        .material-name-input:focus { outline: 1px solid #0078d4; background-color: #f0f8ff; }
        .color-picker-wrapper { position: relative; width: 28px; height: 28px; justify-self: center; }
        .color-swatch, input[type="color"] { width: 100%; height: 100%; border-radius: 4px; }
        .color-swatch { border: 1px solid #ccc; }
        input[type="color"] { position: absolute; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .paint-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 0 5px; opacity: 0.7; justify-self: center; }
        .paint-btn:hover { color: #0078d4; opacity: 1; }
        /* Botão de deletar foi removido */
        .footer { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .footer button { width: 100%; padding: 12px; font-size: 14px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; font-weight: 500; }
        #toggle-colors-btn { background-color: #0078d4; color: white; border-color: #005a9e; }
        #create-palette-btn { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Gerenciador de Cores</h3>
            <div class="header-actions">
                <span id="material-count" class="material-count">0 materiais</span>
                <!-- Botão de Adicionar foi removido daqui -->
            </div>
        </div>
        <input type="text" id="search-box" placeholder="Buscar material...">
        <div id="material-list-container">
            <div class="material-item list-header">
                <span>Material</span>
                <span id="header-col-a">A</span>
                <span id="header-col-b">B</span>
                <span></span> <!-- Coluna para o botão de pintar -->
            </div>
            <div id="material-list"></div>
        </div>
        <div class="footer">
            <button id="toggle-colors-btn">Alternar Cores (A ↔ B)</button>
            <button id="create-palette-btn">Criar/Atualizar Paleta</button>
        </div>
    </div>

    <script>
        let materialsData = [];

        function renderMaterialList(filter = '') {
            const listDiv = document.getElementById('material-list');
            listDiv.innerHTML = '';
            const filteredData = materialsData.filter(mat => mat.name.toLowerCase().includes(filter.toLowerCase()));
            
            filteredData.forEach(mat => {
                const item = document.createElement('div');
                item.className = 'material-item';
                const matName = mat.name;
                
                // Template de item sem o botão de deletar
                item.innerHTML = `
                    <input type="text" class="material-name-input" value="${matName}" data-old-name="${matName}">
                    <div class="color-picker-wrapper" title="Editar Cor A">
                        <div class="color-swatch" style="background-color: ${mat.color_a};"></div>
                        <input type="color" class="color-editor" data-type="a" value="${mat.color_a}" data-name="${matName}">
                    </div>
                    <div class="color-picker-wrapper" title="Editar Cor B">
                        <div class="color-swatch" style="background-color: ${mat.color_b};"></div>
                        <input type="color" class="color-editor" data-type="b" value="${mat.color_b}" data-name="${matName}">
                    </div>
                    <button class="paint-btn" title="Pintar com '${matName}'" onclick="activatePaintTool('${matName}')">
                        <i class="fas fa-paint-brush"></i>
                    </button>
                `;
                listDiv.appendChild(item);
            });
            addEventListeners();
        }
        
        function addEventListeners() {
            document.querySelectorAll('input.color-editor').forEach(input => {
                input.addEventListener('change', (event) => {
                    const matName = event.target.getAttribute('data-name');
                    const colorType = event.target.getAttribute('data-type');
                    const newColor = event.target.value;
                    const materialToUpdate = (colorType === 'a') ? matName : `${matName} (Alternativo)`;
                    if (typeof sketchup !== 'undefined') {
                        sketchup.update_material_color(materialToUpdate, newColor);
                        setTimeout(() => sketchup.load_initial_data(), 50);
                    }
                });
            });

            document.querySelectorAll('input.material-name-input').forEach(input => {
                input.addEventListener('change', (event) => {
                    const oldName = event.target.getAttribute('data-old-name');
                    const newName = event.target.value;
                    if (newName && newName !== oldName && typeof sketchup !== 'undefined') {
                        sketchup.rename_material(oldName, newName);
                    }
                });
            });
        }
        
        // Função deleteMaterial removida

        function activatePaintTool(materialName) {
            if (typeof sketchup !== 'undefined') {
                sketchup.activate_deep_paint_tool(materialName);
            }
        }

        function populateMaterials(data) {
            materialsData = data;
            document.getElementById('material-count').textContent = `${materialsData.length} materiais`;
            renderMaterialList(document.getElementById('search-box').value);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof sketchup !== 'undefined') sketchup.load_initial_data();
            document.getElementById('search-box').addEventListener('input', (e) => renderMaterialList(e.target.value));
            // Event listener para add_new_material foi removido
            document.getElementById('toggle-colors-btn').addEventListener('click', () => { if (typeof sketchup !== 'undefined') sketchup.toggle_colors(); });
            document.getElementById('create-palette-btn').addEventListener('click', () => { if (typeof sketchup !== 'undefined') sketchup.create_palette(); });
        });
    </script>
</body>
</html>
