<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Cores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #3d4a5c;
            --text-light-color: #8a96a8;
            --border-color: #e9ecef;
            --primary-color: #007bff;
            --header-color: #2a3e54;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --orange: #FF8C00;
            --success: #28a745;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--header-color);
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .material-count {
            font-size: 13px;
            color: var(--text-light-color);
            font-weight: 600;
        }

        #search-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            background-color: white;
        }

        #search-box:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        #material-list-container {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: white;
            box-shadow: var(--shadow);
        }

        .material-item {
            display: grid;
            grid-template-columns: 1fr 40px 40px 25px;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
        }

        .material-item:hover {
            background-color: #f8f9fa;
        }

        .list-header {
            font-weight: 600;
            font-size: 12px;
            color: var(--text-light-color);
            text-transform: uppercase;
            background: linear-gradient(135deg, #f8f9fa, #f0f2f5);
            text-align: center;
            border-bottom: 2px solid var(--border-color);
        }

        .material-name-input {
            font-size: 14px;
            border: none;
            background: transparent;
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .material-name-input:focus {
            outline: none;
            background-color: #f0f8ff;
            border: 1px solid var(--orange);
        }

        .color-picker-wrapper {
            position: relative;
            width: 28px;
            height: 28px;
            justify-self: center;
        }

        .color-swatch,
        input[type="color"] {
            width: 100%;
            height: 100%;
            border-radius: 6px;
        }

        .color-swatch {
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .color-swatch:hover {
            border-color: var(--orange);
        }

        input[type="color"] {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .paint-btn {
            background: none;
            border: none;
            color: var(--text-light-color);
            cursor: pointer;
            font-size: 16px;
            padding: 0 5px;
            transition: all 0.2s ease;
            justify-self: center;
        }

        .paint-btn:hover {
            color: var(--orange);
            transform: scale(1.1);
        }

        .footer {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .footer button {
            width: 100%;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        #toggle-colors-btn {
            background: linear-gradient(135deg, var(--orange), #e67e22);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }

        #toggle-colors-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }

        #create-palette-btn {
            background: #f8f9fa;
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        #create-palette-btn:hover {
            background: var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Gerenciador de Cores</h3>
            <div class="header-actions">
                <span id="material-count" class="material-count">0 materiais</span>
            </div>
        </div>
        <input type="text" id="search-box" placeholder="Buscar material...">
        <div id="material-list-container">
            <div class="material-item list-header">
                <span>Material</span>
                <span id="header-col-a">A</span>
                <span id="header-col-b">B</span>
                <span></span>
            </div>
            <div id="material-list"></div>
        </div>
        <div class="footer">
            <button id="toggle-colors-btn">Alternar Cores (A ↔ B)</button>
            <button id="create-palette-btn">Criar/Atualizar Paleta</button>
        </div>
    </div>

    <script>
        let materialsData = [];

        function renderMaterialList(filter = '') {
            const listDiv = document.getElementById('material-list');
            listDiv.innerHTML = '';
            const filteredData = materialsData.filter(mat => mat.name.toLowerCase().includes(filter.toLowerCase()));

            filteredData.forEach(mat => {
                const item = document.createElement('div');
                item.className = 'material-item';
                const matName = mat.name;

                item.innerHTML = `
                    <input type="text" class="material-name-input" value="${matName}" data-old-name="${matName}">
                    <div class="color-picker-wrapper" title="Editar Cor A">
                        <div class="color-swatch" style="background-color: ${mat.color_a};"></div>
                        <input type="color" class="color-editor" data-type="a" value="${mat.color_a}" data-name="${matName}">
                    </div>
                    <div class="color-picker-wrapper" title="Editar Cor B">
                        <div class="color-swatch" style="background-color: ${mat.color_b};"></div>
                        <input type="color" class="color-editor" data-type="b" value="${mat.color_b}" data-name="${matName}">
                    </div>
                    <button class="paint-btn" title="Pintar com '${matName}'" onclick="activatePaintTool('${matName}')">
                        <i class="fas fa-paint-brush"></i>
                    </button>
                `;
                listDiv.appendChild(item);
            });
            addEventListeners();
        }

        function addEventListeners() {
            document.querySelectorAll('input.color-editor').forEach(input => {
                input.addEventListener('change', (event) => {
                    const matName = event.target.getAttribute('data-name');
                    const colorType = event.target.getAttribute('data-type');
                    const newColor = event.target.value;
                    const materialToUpdate = (colorType === 'a') ? matName : `${matName} (Alternativo)`;
                    if (typeof sketchup !== 'undefined') {
                        sketchup.update_material_color(materialToUpdate, newColor);
                        setTimeout(() => sketchup.load_initial_data(), 50);
                    }
                });
            });

            document.querySelectorAll('input.material-name-input').forEach(input => {
                input.addEventListener('change', (event) => {
                    const oldName = event.target.getAttribute('data-old-name');
                    const newName = event.target.value;
                    if (newName && newName !== oldName && typeof sketchup !== 'undefined') {
                        sketchup.rename_material(oldName, newName);
                    }
                });
            });
        }

        function activatePaintTool(materialName) {
            if (typeof sketchup !== 'undefined') {
                sketchup.activate_deep_paint_tool(materialName);
            }
        }

        function populateMaterials(data) {
            materialsData = data;
            document.getElementById('material-count').textContent = `${materialsData.length} materiais`;
            renderMaterialList(document.getElementById('search-box').value);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof sketchup !== 'undefined') sketchup.load_initial_data();
            document.getElementById('search-box').addEventListener('input', (e) => renderMaterialList(e.target.value));
            document.getElementById('toggle-colors-btn').addEventListener('click', () => { if (typeof sketchup !== 'undefined') sketchup.toggle_colors(); });
            document.getElementById('create-palette-btn').addEventListener('click', () => { if (typeof sketchup !== 'undefined') sketchup.create_palette(); });
        });
    </script>
</body>
</html>
