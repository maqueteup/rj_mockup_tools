<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Analisador de Colisões</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #3d4a5c;
            --text-light-color: #8a96a8;
            --border-color: #e9ecef;
            --primary-color: #007bff;
            --header-color: #2a3e54;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --orange: #FF8C00;
            --success: #28a745;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            padding: 20px;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .analyze-btn {
            flex-grow: 1;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        #analyzeBtn {
            background: linear-gradient(135deg, var(--orange), #e67e22);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }

        #analyzeBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }

        #analyzeBtn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        #stopBtn {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            display: none;
        }

        #stopBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 20px;
            background: linear-gradient(135deg, #f8f9fa, #f0f2f5);
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-color);
            font-weight: 600;
            flex-shrink: 0;
        }

        .progress-bar-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            height: 8px;
            margin-top: 12px;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--orange), #e67e22);
            transition: width 0.1s linear;
        }

        .results-section {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .intersection-list {
            flex-grow: 1;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-light-color);
            font-size: 15px;
        }

        .intersection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid var(--danger);
            animation: fadeIn 0.3s ease-in;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .intersection-item:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .component-pair {
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }

        .select-btn {
            background: #f8f9fa;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .select-btn:hover {
            background: linear-gradient(135deg, var(--orange), #e67e22);
            color: white;
            border-color: var(--orange);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 140, 0, 0.3);
        }

        .focus-controls {
            margin-top: 20px;
            flex-shrink: 0;
        }

        #focus-mode-btn {
            width: 100%;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
        }

        #focus-mode-btn.enter {
            background: linear-gradient(135deg, var(--success), #1e7e34);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        #focus-mode-btn.enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        #focus-mode-btn.exit {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }

        #focus-mode-btn.exit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-controls">
                <button id="analyzeBtn" class="analyze-btn">
                    <i class="fas fa-search-plus"></i>
                    <span class="btn-text">Analisar Colisões</span>
                </button>
                <button id="stopBtn" class="analyze-btn">
                    <i class="fas fa-stop"></i>
                    <span class="btn-text">Parar</span>
                </button>
            </div>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div class="stats-bar">
            <span id="componentCount">Peças: 0</span>
            <span id="suspectCount">Pares Suspeitos: 0</span>
            <span id="intersectionCount">Colisões: 0</span>
        </div>
        <div class="results-section">
            <div id="intersectionList" class="intersection-list">
                <div class="empty-state"><p>Selecione e clique em "Analisar".</p></div>
            </div>
            <div class="focus-controls">
                <button id="focus-mode-btn" class="enter"><i class="fas fa-search-location"></i> Isolar Colisões</button>
            </div>
        </div>
    </div>

    <script>
    class IntersectionAnalyzerUI {
        constructor() {
            this.elements = {
                analyzeBtn: document.getElementById('analyzeBtn'),
                stopBtn: document.getElementById('stopBtn'),
                intersectionList: document.getElementById('intersectionList'),
                componentCount: document.getElementById('componentCount'),
                suspectCount: document.getElementById('suspectCount'),
                intersectionCount: document.getElementById('intersectionCount'),
                progressContainer: document.getElementById('progress-container'),
                progressBar: document.getElementById('progress-bar'),
                focusModeBtn: document.getElementById('focus-mode-btn')
            };
            this.state = {
                workQueue: [],
                totalPairsInQueue: 0,
                isWorking: false,
                collidingPids: new Set(),
                inFocusMode: false
            };
            this.initializeEventListeners();
        }

        initializeEventListeners() {
            this.elements.analyzeBtn.addEventListener('click', () => {
                if (typeof sketchup !== 'undefined') {
                    this.setLoading(true);
                    sketchup.start_analysis(this.state.inFocusMode);
                }
            });

            this.elements.stopBtn.addEventListener('click', () => {
                this.state.isWorking = false;
                this.setLoading(false);
                this.elements.intersectionList.innerHTML = '<div class="empty-state">Análise interrompida.</div>';
            });

            this.elements.focusModeBtn.addEventListener('click', () => {
                if (this.elements.focusModeBtn.classList.contains('exit')) {
                    sketchup.exit_focus_mode();
                } else {
                    sketchup.enter_focus_mode(Array.from(this.state.collidingPids));
                }
            });
        }

        startVerificationProcess(suspectPairs, componentCount) {
            this.updateStats({ components: componentCount, suspects: suspectPairs.length, intersections: 0 });
            this.elements.intersectionList.innerHTML = '';
            this.state.workQueue = suspectPairs;
            this.state.totalPairsInQueue = suspectPairs.length;
            this.state.collidingPids.clear();
            this.elements.focusModeBtn.style.display = 'none';

            if (this.state.workQueue.length === 0) {
                this.setLoading(false);
                if (this.state.inFocusMode) {
                    this.elements.intersectionList.innerHTML = '<div class="empty-state">Nenhuma colisão restante. Saindo do modo de foco...</div>';
                    if (typeof sketchup !== 'undefined') sketchup.exit_focus_mode();
                } else {
                    const message = componentCount < 2 ? "Selecione 2 ou mais peças." : "Nenhuma sobreposição encontrada.";
                    this.elements.intersectionList.innerHTML = `<div class="empty-state">${message}</div>`;
                }
                return;
            }

            this.state.isWorking = true;
            this.processNextInQueue();
        }

        processNextInQueue() {
            if (!this.state.isWorking || this.state.workQueue.length === 0) {
                this.finishProcess();
                return;
            }
            const pair = this.state.workQueue.shift();
            if (typeof sketchup !== 'undefined') {
                sketchup.verify_single_pair(pair);
            }
        }

        handleVerificationResult(pair, isColliding) {
            if (!this.state.isWorking) return;
            if (isColliding) {
                this.addResultToList(pair);
                this.state.collidingPids.add(pair.pid1);
                this.state.collidingPids.add(pair.pid2);
                this.updateStats({ intersections: document.querySelectorAll('.intersection-item').length });
            }
            this.updateProgress();
            setTimeout(() => this.processNextInQueue(), 0);
        }

        updateProgress() {
            const processedCount = this.state.totalPairsInQueue - this.state.workQueue.length;
            const progress = this.state.totalPairsInQueue > 0 ? (processedCount / this.state.totalPairsInQueue) * 100 : 100;
            this.elements.progressBar.style.width = `${progress}%`;
        }

        finishProcess() {
            this.state.isWorking = false;
            this.setLoading(false);
            const collisionItems = document.querySelectorAll('.intersection-item');

            if (collisionItems.length === 0) {
                if (this.state.inFocusMode) {
                    this.elements.intersectionList.innerHTML = '<div class="empty-state">Nenhuma colisão restante. Saindo do modo de foco...</div>';
                    if (typeof sketchup !== 'undefined') sketchup.exit_focus_mode();
                } else {
                    this.elements.intersectionList.innerHTML = '<div class="empty-state">Nenhuma colisão real encontrada.</div>';
                }
            } else {
                this.updateStats({ intersections: collisionItems.length });
                this.elements.focusModeBtn.style.display = 'block';
            }
        }

        addResultToList(intersection) {
            const item = document.createElement('div');
            item.className = 'intersection-item';
            item.id = `pair_${intersection.pid1}_${intersection.pid2}`;

            const mainText = `${intersection.definitionName1} & ${intersection.definitionName2}`;
            const tooltipText = `Instâncias: ${intersection.instanceName1} & ${intersection.instanceName2}`;

            item.title = tooltipText;
            item.innerHTML = `<div class="component-pair">${mainText}</div><button class="select-btn" onclick="window.analyzerUI.selectPairInSketchUp(${intersection.pid1}, ${intersection.pid2})">Selecionar</button>`;

            this.elements.intersectionList.appendChild(item);
        }

        setFocusMode(isActive) {
            this.state.inFocusMode = isActive;
            const btnText = this.elements.analyzeBtn.querySelector('.btn-text');
            if (isActive) {
                this.elements.focusModeBtn.classList.replace('enter', 'exit');
                this.elements.focusModeBtn.innerHTML = '<i class="fas fa-eye-slash"></i> Sair do Modo de Foco';
                if(btnText) btnText.textContent = 'Re-analisar Foco';
                this.elements.focusModeBtn.style.display = 'block';
            } else {
                this.elements.focusModeBtn.classList.replace('exit', 'enter');
                this.elements.focusModeBtn.innerHTML = '<i class="fas fa-search-location"></i> Isolar Colisões';
                if(btnText) btnText.textContent = 'Analisar Colisões';
                this.elements.intersectionList.innerHTML = '<div class="empty-state"><p>Clique em "Analisar" para iniciar.</p></div>';
                this.updateStats({ components: 0, suspects: 0, intersections: 0 });
                this.elements.focusModeBtn.style.display = 'none';
            }
        }

        setLoading(loading) {
            this.elements.analyzeBtn.style.display = loading ? 'none' : 'flex';
            this.elements.stopBtn.style.display = loading ? 'flex' : 'none';
            this.elements.progressContainer.style.display = loading ? 'block' : 'none';
            if (loading) this.elements.progressBar.style.width = '0%';
        }

        updateStats({ components, suspects, intersections }) {
            if (components !== undefined) this.elements.componentCount.textContent = `Peças: ${components}`;
            if (suspects !== undefined) this.elements.suspectCount.textContent = `Pares Suspeitos: ${suspects}`;
            if (intersections !== undefined) this.elements.intersectionCount.textContent = `Colisões: ${intersections}`;
        }

        selectPairInSketchUp(pid1, pid2) { if (typeof sketchup !== 'undefined') sketchup.select_instances([pid1, pid2]); }
    }
    window.analyzerUI = new IntersectionAnalyzerUI();
    </script>
</body>
</html>
